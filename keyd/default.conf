[ids]
*
# Exclude Kanata's output using its FULL id from `keyd monitor`.
# The short id 0001:0001 also belongs to many physical laptop keyboards.
-0001:0001:0e03123f

[global]
# Keep Tab's tap behavior independent of how long it was held.
overload_tap_timeout = 0

[main]
# Before 200 ms, a release taps Escape and another key activates Control.
# After 200 ms, Control only: releasing Caps alone does not send Escape.
capslock = timeout(overload(control, esc), 200, layer(control))
tab = overload(tabnav, tab)

[control]
tab = C-tab

[alt]
tab = A-tab

[tabnav]
capslock = capslock
1 = f1
2 = f2
3 = f3
4 = f4
5 = f5
6 = f6
7 = f7
8 = f8
9 = f9
0 = f10
- = f11
= = f12
w = (
e = )
s = {
d = }
x = [
c = ]
r = <
f = >
g = ;
v = =
h = left
j = down
k = up
l = right
y = home
o = end
u = pageup
m = pagedown
